<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Plaintext</title><link rel="stylesheet" href="/web/app.css"><link rel="icon" type="image/png" href="/web/app-icon.png"></head>
<body><main><section id="start-screen" hidden aria-label="Open files"><div class="start-actions"><div class="start-tabs" role="tablist" aria-label="Files"><button id="start-recent" role="tab" aria-selected="true" aria-controls="recent-panel">Recent</button><button id="start-open" role="tab" aria-selected="false" aria-controls="picker" tabindex="-1">Open</button></div><button id="start-new">New text file</button></div><div id="recent-panel" role="tabpanel" aria-labelledby="start-recent"><div id="recent-files"></div><p id="recent-empty">Files you open on this server will appear here.</p></div><div id="move-fields" hidden><h3 id="move-heading">Move or rename file</h3><label for="move-name">Name</label><input id="move-name" type="text" autocomplete="off" spellcheck="false"><p>Choose the destination folder below.</p></div><div id="picker" role="tabpanel" aria-labelledby="start-open" hidden><div class="picker-location"><label class="picker-target"><select id="environment" aria-label="Host or container"><option value="host">Host</option></select></label><button id="environment-refresh" type="button" title="Refresh hosts and containers" aria-label="Refresh hosts and containers">↻</button></div><div id="environment-errors" role="status"></div><nav id="pickerPath" aria-label="Folder path"></nav><div id="pickerRows" role="listbox" aria-label="Files and folders" tabindex="0"></div><div class="picker-actions"><button id="choose" class="primary" disabled>Open file</button></div></div></section><header class="document-toolbar"><button id="home" aria-expanded="false" aria-controls="start-overlay" aria-haspopup="dialog" aria-label="Open files" title="Open files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19V6a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v3M3 19l3-8h16l-3 8H3Z"/></svg></button><div class="document-location"><button id="location-target" class="location-target" aria-label="Choose host or container" aria-haspopup="dialog"><span id="targetLabel">Host</span><span aria-hidden="true">▾</span></button><span class="location-separator" aria-hidden="true">›</span><button id="path" class="path" aria-haspopup="dialog" title="Move / Rename…"><span id="pathLabel">Untitled</span></button><span id="dirty" aria-label="Document status"></span></div><div class="document-actions"><details id="document-info"><summary aria-label="File information" title="File information"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg></summary><div class="document-info-panel"><strong id="info-name">Untitled</strong><div id="info-target"></div><div id="info-path"></div><button id="move">Move / Rename…</button></div></details><button id="save" class="primary" aria-label="Save" hidden>Save</button><details id="document-menu"><summary aria-label="Document actions" title="Document actions">•••</summary><div class="document-menu"><button id="overflow-home" class="overflow-only">Plaintext start screen</button><div id="overflow-info" class="overflow-only"><strong id="overflow-info-name"></strong><div id="overflow-info-target"></div><div id="overflow-info-path"></div></div><button id="mobile-location" class="mobile-action">Choose host or container…</button><div class="text-size-controls" role="group" aria-label="Text size"><button id="text-smaller" aria-label="Smaller text" title="Smaller text">A−</button><button id="text-size-reset" aria-label="Reset text size" title="Reset text size">100%</button><button id="text-larger" aria-label="Larger text" title="Larger text">A+</button></div><button id="wrap-lines" aria-pressed="true">Wrap lines</button><button id="recover">Recover draft…</button><button id="download">Download a copy</button><button id="review" hidden>Review changes…</button></div></details></div></header><footer id="status" role="status">Open a file or create a new document</footer><textarea id="editor" wrap="soft" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Text editor"></textarea></main>
<dialog id="start-overlay" aria-label="Plaintext start screen"><div id="start-overlay-content"><p id="start-overlay-status" role="status"></p></div></dialog><script src="/web/environment.js"></script><script src="/web/offline.js"></script><script src="/web/app.js"></script></body></html>
