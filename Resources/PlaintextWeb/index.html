<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Plaintext</title><link rel="stylesheet" href="/web/app.css"><link rel="icon" type="image/png" href="/web/app-icon.png"></head>
<body><main><header class="document-toolbar"><div class="document-location"><button id="location-target" class="location-target" aria-label="Choose host or container" aria-haspopup="dialog"><span id="targetLabel">Host</span><span aria-hidden="true">▾</span></button><span class="location-separator" aria-hidden="true">›</span><button id="path" class="path" aria-haspopup="dialog" title="Browse files"><span id="pathLabel">Open or create a document</span></button><span id="dirty" aria-label="Document status"></span></div><div class="document-actions"><button id="new" class="quiet">New</button><button id="open" class="quiet">Open…</button><details id="document-menu"><summary aria-label="Document actions" title="Document actions">•••</summary><div class="document-menu"><button id="recover">Recover draft…</button><button id="download">Download a copy</button><button id="review" hidden>Review changes…</button><button id="move">Move / Rename…</button></div></details><button id="save" class="primary">Save</button></div></header><textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Text editor"></textarea><footer id="status" role="status">Open a file or create a new document</footer></main>
<dialog id="picker"><form method="dialog"><header><button value="cancel">Cancel</button><strong>Open a file</strong><button id="choose" value="default" class="primary" disabled>Open</button></header><div class="picker-location"><label class="picker-target"><select id="environment" aria-label="Host or container"><option value="host">Host</option></select></label><button id="environment-refresh" type="button" title="Refresh hosts and containers" aria-label="Refresh hosts and containers">↻</button></div><div id="environment-errors" role="status"></div><nav id="pickerPath" aria-label="Folder path"></nav><div id="pickerRows"></div></form></dialog><script src="/web/environment.js"></script><script src="/web/offline.js"></script><script src="/web/app.js"></script></body></html>
