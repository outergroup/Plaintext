<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Plaintext</title><link rel="stylesheet" href="/web/app.css"><link rel="icon" type="image/png" href="/web/app-icon.png"></head>
<body><main><section id="start-screen" hidden aria-labelledby="start-title"><h1 id="start-title">Plaintext</h1><div class="start-actions"><button id="start-open" class="primary">Open…</button><button id="start-new">New text file</button></div><h2>Recent files</h2><div id="recent-files"></div><p id="recent-empty">Files you open in this browser will appear here.</p></section><header class="document-toolbar"><button id="home" aria-label="Plaintext start screen" title="Plaintext start screen"><img src="/web/app-icon.png" alt="" width="28" height="28"></button><div class="document-location"><button id="location-target" class="location-target" aria-label="Choose host or container" aria-haspopup="dialog"><span id="targetLabel">Host</span><span aria-hidden="true">▾</span></button><span class="location-separator" aria-hidden="true">›</span><button id="path" class="path" aria-haspopup="dialog" title="Move / Rename…"><span id="pathLabel">Open or create a document</span></button><span id="dirty" aria-label="Document status"></span></div><div class="document-actions"><details id="document-info"><summary aria-label="File information" title="File information"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg></summary><div class="document-info-panel"><strong id="info-name">Untitled</strong><div id="info-target"></div><div id="info-path"></div><button id="move">Move / Rename…</button></div></details><button id="save" class="primary" aria-label="Save" hidden>Save</button><details id="document-menu"><summary aria-label="Document actions" title="Document actions">•••</summary><div class="document-menu"><button id="overflow-home" class="overflow-only">Plaintext start screen</button><div id="overflow-info" class="overflow-only"><strong id="overflow-info-name"></strong><div id="overflow-info-target"></div><div id="overflow-info-path"></div></div><button id="mobile-location" class="mobile-action">Choose host or container…</button><button id="wrap-lines" aria-pressed="true">Wrap lines</button><button id="recover">Recover draft…</button><button id="download">Download a copy</button><button id="review" hidden>Review changes…</button></div></details></div></header><footer id="status" role="status">Open a file or create a new document</footer><textarea id="editor" wrap="soft" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Text editor"></textarea></main>
<dialog id="start-overlay" aria-labelledby="start-title"><button id="start-close" aria-label="Close start screen" title="Close" autofocus>×</button><p id="start-overlay-status" role="status"></p></dialog><dialog id="picker"><form method="dialog"><header><button value="cancel">Cancel</button><strong>Open a file</strong><button id="choose" value="default" class="primary" disabled>Open</button></header><div class="picker-location"><label class="picker-target"><select id="environment" aria-label="Host or container"><option value="host">Host</option></select></label><button id="environment-refresh" type="button" title="Refresh hosts and containers" aria-label="Refresh hosts and containers">↻</button></div><div id="environment-errors" role="status"></div><nav id="pickerPath" aria-label="Folder path"></nav><div id="pickerRows"></div></form></dialog><script src="/web/environment.js"></script><script src="/web/offline.js"></script><script src="/web/app.js"></script></body></html>
